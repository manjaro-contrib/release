# Generated by Wrangler on Sun May 12 2024 11:00:18 GMT+0200 (Central European Summer Time)
name = "manjaro-contrib-releases"
main = "src/index.js"
compatibility_date = "2026-09-04"
# the login sees several accounts; pin the one owning the bucket
account_id = "ed740e1b87e525691b947ca317a3cb90"

# custom domain rather than a route: cloudflare provisions the dns record
# and certificate, and the zone lives in the same account as the worker
routes = [
  { pattern = "manjaro.download", custom_domain = true },
]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "releases"

# analytics engine retains three months, so it answers which build people
# took while that is still interesting; the rollup below keeps the trend
# once the detail expires
[[analytics_engine_datasets]]
binding = "DOWNLOADS"
dataset = "iso_downloads"

# the archive the rollup writes into. A download NEVER writes here: kv
# allows one write per second per key and propagates globally for up to
# 60s, so a counter incremented from the request path loses counts to
# last-write-wins
[[kv_namespaces]]
binding = "STATS"
id = "PLACEHOLDER_REPLACE_WITH_NAMESPACE_ID"

[triggers]
# the 2nd rather than the 1st: a month's final downloads must be
# queryable before it is archived, and ingestion is not instant
crons = ["17 3 2 * *"]
