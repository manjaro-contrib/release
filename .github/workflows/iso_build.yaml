name: x86 Builds
on:
  schedule:
    - cron:  '30 17 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/iso_build.yaml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  MATRIX_ROOM_ID: "!XXstZzLEcUVKyTcqCA:matrix.org"
  MIRROR: https://opencolo.mm.fcix.net/manjaro

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - id: time
        uses: boredland/get-time-action@dbc808befb89eb33fee64f5f4abce4d2a5fa7cfd # tag=2.0.0
        with:
          format: 'YYYYMMDDHHmm'
      - id: kernel
        uses: boredland/kernel-info@f781d0a7da20c30fc67dfbb6dc0a7e219f529d6c # main
    outputs:
      release_tag: rc-${{ steps.time.outputs.time }}
      stable: ${{ steps.kernel.outputs.stable-pkg }}
      longterm: ${{ steps.kernel.outputs.longterm-pkg }}
  build:
    runs-on: ubuntu-latest
    needs: [prepare-release]
    name: ${{ matrix.branch }} x86_64 ${{ matrix.edition }}
    permissions:
      contents: write
    outputs:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    strategy:
      # one combination failing must not withhold the others
      fail-fast: false
      # 18 combinations, each a full iso build; cap the concurrency so a
      # run does not occupy every available runner for hours
      max-parallel: 6
      matrix:
        # the editions manjaro.org offers for download
        edition: [kde, xfce, gnome, cinnamon, i3, sway]
        branch: [stable, testing, unstable]
        include:
          - repo: https://gitlab.manjaro.org/profiles-and-settings/iso-profiles.git
          - edition: sway
            repo: https://github.com/manjaro-sway/iso-profiles
    steps:
      - name: x86_64 build
        uses: manjaro-contrib/action-buildiso@377cedc76ac456dca7549920eff95ddcaf45c4dc # main
        with:
          iso-profiles-repo: ${{ matrix.repo }}
          edition: ${{ matrix.edition }}
          branch: ${{ matrix.branch }}
          scope: full
          # stable ships the longterm kernel, the moving branches the stable one
          kernel: ${{ matrix.branch == 'stable' && needs.prepare-release.outputs.longterm || needs.prepare-release.outputs.stable }}
          release-tag: ${{ needs.prepare-release.outputs.release_tag }}
          build-mirror: ${{ env.MIRROR }}
          gpg-secret-key-base64: ${{ secrets.GPG_SECRET_BASE64 }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - name: install tooling
        run: pip install boto3
      - name: publish this image
        # each build mirrors its own iso, so a finished edition is
        # downloadable while the others are still compiling
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/publish_iso.py \
            --release "$RELEASE_TAG" \
            --edition "${{ matrix.edition }}" \
            --branch "${{ matrix.branch }}"
  prune:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    # every edition must have published first. If one failed, its newest
    # working image is in an older release, and pruning could delete the
    # only copy that edition still has.
    if: needs.build.result == 'success'
    name: prune superseded releases
    # deleting pruned releases and their tags needs write access
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        run: pip install boto3
      - name: prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 scripts/prune_releases.py --repo "${{ github.repository }}" --keep 10
      - name: refresh the state files
        # the builds each write state as they finish, so pollers see
        # progress; this settles it once the bucket has stopped changing
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 scripts/refresh_state.py
  notify:
    runs-on: ubuntu-latest
    needs: [build, prune]
    # a failed build leaves the previous release in place, so there is
    # nothing to roll back - only something to report. prune is skipped
    # when a build fails, and a skipped dependency alone would make
    # failure() false, so test the build result directly.
    if: always() && (needs.build.result == 'failure' || needs.prune.result == 'failure')
    steps:
      - uses: s3krit/matrix-message-action@70ad3fb812ee0e45ff8999d6af11cafad11a6ecf # v0.0.3
        with:
          room_id: ${{ env.MATRIX_ROOM_ID }}
          access_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          message: "😬 Error building for **x86**: Please have a look into the [logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          server: "matrix.org"
