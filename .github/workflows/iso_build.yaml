name: x86 Builds
on:
  schedule:
    - cron:  '30 17 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/iso_build.yaml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  MATRIX_ROOM_ID: "!XXstZzLEcUVKyTcqCA:matrix.org"
  MIRROR: https://opencolo.mm.fcix.net/manjaro

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - id: time
        uses: boredland/get-time-action@dbc808befb89eb33fee64f5f4abce4d2a5fa7cfd # tag=2.0.0
        with:
          format: 'YYYYMMDDHHmm'
      - id: kernel
        uses: boredland/kernel-info@main
    outputs:
      release_tag: rc-${{ steps.time.outputs.time }}
      stable: ${{ steps.kernel.outputs.stable-pkg }}
  build:
    runs-on: ubuntu-latest
    needs: [prepare-release]
    name: unstable x86_64 sway
    permissions:
      contents: write
    outputs:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: x86_64 build
        uses: manjaro-contrib/action-buildiso@main
        with:
          iso-profiles-repo: https://github.com/manjaro-sway/iso-profiles
          edition: sway
          branch: unstable
          scope: full
          kernel: ${{ needs.prepare-release.outputs.stable }}
          release-tag: ${{ needs.prepare-release.outputs.release_tag }}
          build-mirror: ${{ env.MIRROR }}
          gpg-secret-key-base64: ${{ secrets.GPG_KEY_BASE64 }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
  publish:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    name: publish to the release bucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        run: pip install boto3
      - name: publish the iso
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 scripts/publish_iso.py --release "$RELEASE_TAG"
  rollback:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    if: cancelled() || failure()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_COUNT=$(gh release view ${{ needs.prepare-release.outputs.release_tag }} --json "assets" --jq '.assets | length')
          # more than the two tarballs github creates means there is something
          # to inspect, so keep the release
          if [ "$ASSET_COUNT" -gt "2" ]; then exit 0; fi
          gh release delete ${{ needs.prepare-release.outputs.release_tag }} -y --repo ${{ github.repository }}
          git push --delete origin ${{ needs.prepare-release.outputs.release_tag }}
      - uses: s3krit/matrix-message-action@v0.0.3
        with:
          room_id: ${{ env.MATRIX_ROOM_ID }}
          access_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          message: "😬 Error building sway for **x86** (unstable): Please have a look into the [logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          server: "matrix.org"
